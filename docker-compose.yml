version: '3.9'

services:
  python-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-python-app:1.0
    container_name: python-container
    # entrypoint: ["python", "src/p.py"]
    # command: ["42"]
  
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"